<svg width="680" height="830" viewBox="0 0 680 830" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Statistical arbitrage pipeline</title>
<desc>Eight-stage pipeline: data ingestion, rolling PCA, clustering, Kalman filter, diagnostics gate, OU calibration, backtest engine, and TCN risk overlay.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="140" y="20" width="400" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Data ingestion</text>
<text x="340" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Equity returns via yfinance</text>
<line x1="340" y1="76" x2="340" y2="116" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="116" width="400" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="134" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Rolling PCA</text>
<text x="340" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Walk-forward eigenfactor extraction</text>
<line x1="340" y1="172" x2="340" y2="212" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="212" width="400" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="230" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Clustering</text>
<text x="340" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">UMAP and DBSCAN grouping</text>
<line x1="340" y1="268" x2="340" y2="308" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="308" width="400" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="326" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Kalman filter</text>
<text x="340" y="344" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Idiosyncratic residual extraction</text>
<line x1="340" y1="364" x2="340" y2="404" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="404" width="400" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="340" y="422" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#4A1B0C">Diagnostics gate</text>
<text x="340" y="440" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">ADF and autocorrelation screen</text>
<line x1="340" y1="460" x2="340" y2="500" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="500" width="400" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="518" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">OU calibration</text>
<text x="340" y="536" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Mean-reversion s-score signals</text>
<line x1="340" y1="556" x2="340" y2="596" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="596" width="400" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="614" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">Backtest engine</text>
<text x="340" y="632" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Signals, weights, PnL</text>
<line x1="340" y1="652" x2="340" y2="692" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="692" width="400" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="710" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#412402">Risk overlay (TCN)</text>
<text x="340" y="728" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">Dynamic VaR-based de-leveraging</text>
</svg>
